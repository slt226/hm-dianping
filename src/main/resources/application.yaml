server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123321}
  rabbitmq:
    host: ${MQ_HOST:127.0.0.1}
    port: ${MQ_PORT:5672}
    username: ${MQ_USER:guest}
    password: ${MQ_PASSWORD:guest}
    connection-timeout: 3000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true #监控失败路由，以禁止静默丢弃
    listener:
      simple:
              concurrency: 2 # 消费线程数。默认 1 时同一队列严格串行，唯一约束兜底分支永远走不到；
                             # 设 2 等价于"多实例"场景，让"并发重复消息"可以被复现和验证。
              prefetch: 1    # 每个消费者最多预取 1 条未 ack 消息。默认 250 时先连上的消费者会把队列里
                             # 现成的消息全抓走（看起来 concurrency=2 实际仍是串行）；压到 1 才会真正分发。
              default-requeue-rejected: false # 重试耗尽后 reject(requeue=false)，让 broker 按 x-dead-letter-* 转进死信队列。
                                              # 默认 true 时 Spring 只是把消息塞回队列 → 无限重投（实测 2 秒 82 次）。
              retry:                          # 本地内存重试：在消费者线程里循环，不经过 MQ、不产生 redelivered 标记。
                enabled: true                 # 关掉它就等于只有 1 次机会，业务抖动必然进死信，可用性太低。
                max-attempts: 3               # 总共执行 3 次 = 首次 + 重试 2 次。别配太大，毒消息会拖住消费者线程。
                initial-interval: 1s          # 首次重试前等 1s，给下游一点自愈时间。
                multiplier: 2                 # 退避倍数：1s -> 2s，避免"立刻重试再失败"的抖动放大器。
                max-interval: 10s

  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl     # 用 Slf4jImpl 而不是 StdOutImpl：后者只写 System.out，不进 logback 文件，
    # 导致 logs/hmdp.log 里查不到任何 SQL，
    map-underscore-to-camel-case: true # 驼峰命名自动转换
logging:
  level:
    root: info
    com.hmdp: debug # 项目包输出debug级日志
    org.springframework: info
  file:
    name: logs/hmdp.log # 日志同时输出到文件

# 秒杀队列告警（05）。四个数字都不写死在代码里，因为它们全是"运维口径"：
# 阈值定多少取决于队列平时的水位；改一次就要重新打包，这是唯一正确的取舍。
seckill:
  alert:
    sample-interval-ms: 30000   # 采样间隔 30 秒：采样要密（看得到趋势），确认要长（滤掉抖动）
    confirm-seconds: 120        # 违规持续 120 秒才告警。消费端本地重试 1s+2s、消费者重启几秒都在这窗口内
    remind-seconds: 600         # 告警中的定期提醒 10 分钟一次。否则 30 秒一条 error，真报警会被淹没
    backlog-threshold: 1000     # ready 超过 1000 条算"消费跟不上"。正常情况下秒杀队列水位是 0
    # 监控名单。新增队列（退款回补、库存校准）必须加到这里，否则等于没监控——
    # 而这种漏配不会报错，只会让某一天的事故"恰好没告警"。
    queues: seckill.queue,seckill.dlq

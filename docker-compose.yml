# 只编排"依赖"，应用本身用 mvn spring-boot:run 跑 —— 开发期热重载更方便。
#
# 端口说明（和教程默认值不同，这是本机环境的真实约束）：
#   本机已经装了 MySQL(3306) / Redis(6379) / RabbitMQ(5672)，且里面有 Day 8-11 的测试数据。
#   直接占用同名端口会报 "port is already allocated"，所以宿主机侧统一右移一位：
#       容器内  3306 -> 宿主机 3307
#       容器内  6379 -> 宿主机 6380
#       容器内  5672 -> 宿主机 5673（管理台 15672 -> 15673）
#   容器内部端口保持不变，所以 compose 里的 healthcheck 仍用 127.0.0.1:3306 是对的。
#   切到 Docker 依赖时，用环境变量覆盖 application.yaml 的默认值：
#       $env:DB_URL="jdbc:mysql://127.0.0.1:3307/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true"
#       $env:REDIS_PORT="6380"
#       $env:MQ_PORT="5673"
#   不设这些变量时，应用仍然连本机原有服务，两套环境互不干扰。

services:
  mysql:
    image: mysql:8.0
    container_name: hmdp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports: ["3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:6
    container_name: hmdp-redis
    # 密码必须和 application.yaml 的默认值一致，否则报 "ERR Client sent AUTH, but no password is set"
    command: ["redis-server", "--requirepass", "123321", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: hmdp-rabbitmq
    ports: ["5673:5672", "15673:15672"]   # 15673 = 管理台（http://127.0.0.1:15673，guest/guest）
    volumes:
      - mq-data:/var/lib/rabbitmq

volumes:
  mysql-data:
  redis-data:
  mq-data:
